name: env_clam
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - openslide
  - pandas
  - matplotlib
  - seaborn
  - tqdm
  - h5py
  - pillow
  - scipy
  - scikit-learn
  - pyyaml
  - pip

  - pytorch=2.2
  - torchvision
  - pytorch-cuda=12.1
  - lightning
  
  - pip:
      - timm==0.9.8
      - opencv-python
      - openslide-python
      - tensorboardX
      - future
      - git+https://github.com/oval-group/smooth-topk.git
      - numpy==1.26.4